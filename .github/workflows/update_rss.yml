name: Actualizar RSS de Olimpia

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Permiso necesario para permitir que la acción guarde y suba el archivo XML
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar script de filtrado
        run: |
          python main.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add olimpia.xml
          git diff --quiet && git diff --cached --quiet || (git commit -m "Actualización automática RSS Olimpia" && git push)
