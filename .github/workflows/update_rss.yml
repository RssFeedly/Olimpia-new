name: Actualizar RSS de Olimpia

on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas (puedes cambiarlo si prefieres)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar script de filtrado
        run: |
          python main.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]sz"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add olimpia.xml
          git diff --quiet && git diff --cached --quiet || (git commit -m "Actualización automática RSS Olimpia" && git push)
